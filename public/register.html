<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeowMeow Nail — สมัครสมาชิก</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#f4a7b9;--pink2:#f7c5d0;--pink3:#fde8ed;--deep:#c2607a;--deeper:#a04060;--bg:#fff9fa;--border:#fbd5de;--text:#3d2030;--muted:#b07a8a;--red:#e05c5c;--green:#5dab85}
body{background:linear-gradient(160deg,#fff5f7,#fde8ed);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Sarabun',sans-serif}
.card{background:white;border:1px solid var(--border);border-radius:20px;padding:36px 32px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(244,167,185,.2)}
.logo-wrap{text-align:center;margin-bottom:24px}
.logo-img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--pink2);box-shadow:0 6px 18px rgba(244,167,185,.3);margin-bottom:10px}
.logo-name{font-family:'Mitr',sans-serif;font-size:18px;font-weight:600;color:var(--deep)}
.logo-sub{color:var(--muted);font-size:12px;margin-top:2px}
label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.2s;margin-bottom:4px}
input:focus{border-color:var(--pink)}
.field{margin-bottom:14px}
.checks{font-size:12px;margin-bottom:14px;padding:10px 14px;background:var(--bg);border-radius:8px;display:flex;flex-direction:column;gap:3px}
.ci{color:var(--muted);transition:.2s}
.ci.ok{color:var(--green)}
.ci.fail{color:var(--red)}
.btn{width:100%;padding:13px;background:var(--deep);color:white;border:none;border-radius:12px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(160,64,96,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:14px;text-decoration:none}
.link span{color:var(--deep);font-weight:500}
.err{background:rgba(224,92,92,.08);border:1px solid rgba(224,92,92,.25);border-radius:8px;padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="/logo.jpg" class="logo-img" alt="MeowMeow">
    <div class="logo-name">MeowMeow Nail Studio 🐾</div>
    <div class="logo-sub">สร้างบัญชีใหม่</div>
  </div>
  <div class="err" id="err"></div>
  <div class="field"><label>Username</label><input id="u" placeholder="ชื่อผู้ใช้" oninput="validate()"></div>
  <div class="field"><label>Email</label><input type="email" id="e" placeholder="example@gmail.com" oninput="validate()"></div>
  <div class="field"><label>เบอร์โทร</label><input id="ph" placeholder="0xxxxxxxxx" oninput="validate()"></div>
  <div class="field">
    <label>รหัสผ่าน</label>
    <input type="password" id="pw" placeholder="อย่างน้อย 8 ตัว" oninput="validate()">
    <div class="checks">
      <div class="ci" id="c1">— อย่างน้อย 8 ตัวอักษร</div>
      <div class="ci" id="c2">— มีตัวพิมพ์ใหญ่ (A-Z)</div>
      <div class="ci" id="c3">— มีตัวเลข (0-9)</div>
    </div>
  </div>
  <button class="btn" id="btn" onclick="reg()" disabled>สมัครสมาชิก 🐾</button>
  <a href="/login.html" class="link">มีบัญชีแล้ว? <span>เข้าสู่ระบบ</span></a>
</div>
<script>
function validate(){
  const pw=document.getElementById('pw').value
  const l=pw.length>=8,u=/[A-Z]/.test(pw),n=/\d/.test(pw)
  const mark=(id,ok)=>{const el=document.getElementById(id);el.classList.toggle('ok',ok);el.classList.toggle('fail',!ok&&pw.length>0);el.textContent=(ok?'✓':'—')+' '+el.textContent.replace(/^[✓—] /,'')}
  mark('c1',l);mark('c2',u);mark('c3',n)
  document.getElementById('btn').disabled=!(l&&u&&n&&document.getElementById('u').value.trim()&&document.getElementById('e').value.trim()&&document.getElementById('ph').value.trim())
}
async function reg(){
  const err=document.getElementById('err'),btn=document.getElementById('btn')
  const data={username:document.getElementById('u').value.trim(),email:document.getElementById('e').value.trim(),phone:document.getElementById('ph').value.trim(),password:document.getElementById('pw').value}
  btn.disabled=true;btn.textContent='⏳ กำลังสมัคร...';err.style.display='none'
  try{
    const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    const d=await r.json()
    if(!r.ok){err.textContent=d.error;err.style.display='block';return}
    location.href='/login.html'
  }catch(e){err.textContent='เกิดข้อผิดพลาด';err.style.display='block'}
  finally{btn.disabled=false;btn.textContent='สมัครสมาชิก 🐾'}
}
</script>
</body>
</html>
