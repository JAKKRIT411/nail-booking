<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
display:flex;
background:#f1f5f9;
}

/* SIDEBAR */

.sidebar{
width:230px;
background:#111827;
color:white;
min-height:100vh;
padding:20px;
}

.sidebar h2{
margin-bottom:25px;
}

.menu-item{
padding:10px;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
}

.menu-item:hover{
background:#374151;
}

/* MAIN */

.main{
flex:1;
padding:20px;
}

header{
background:white;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.section{display:none}
.active{display:block}

/* CARD */

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 3px 8px rgba(0,0,0,0.05);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

/* SLOT */

.slot{
background:#f9fafb;
padding:8px;
border-radius:8px;
margin-bottom:6px;
font-size:13px;
}

/* BADGE */

.badge{
padding:4px 8px;
border-radius:12px;
font-size:11px;
color:white;
}

.green{background:#16a34a}
.orange{background:#f59e0b}
.gray{background:#6b7280}

/* BUTTON */

button{
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
background:#111827;
color:white;
font-size:12px;
}

button:hover{opacity:0.85}

button:disabled{
opacity:0.4;
cursor:not-allowed;
}

input{
padding:6px;
border-radius:6px;
border:1px solid #ddd;
margin-right:6px;
}

img{
max-width:150px;
border-radius:8px;
margin-top:6px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>Admin</h2>

<div class="menu-item" onclick="show('dashboard')">📊 Dashboard</div>
<div class="menu-item" onclick="show('calendar')">📆 Calendar</div>
<div class="menu-item" onclick="show('bookings')">📋 Bookings</div>
<div class="menu-item" onclick="show('services')">💅 Services</div>

</div>

<div class="main">

<header>

<div>
<strong>Admin Panel</strong>
</div>

<div>
👤 <span id="adminName"></span>
<button onclick="logout()">Logout</button>
</div>

</header>

<!-- DASHBOARD -->

<div id="dashboard" class="section active">

<div class="grid">

<div class="card">
<h3>Revenue</h3>
<h2 id="totalRevenue">0</h2>
</div>

<div class="card">
<h3>Total Bookings</h3>
<h2 id="totalBookings">0</h2>
</div>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- CALENDAR -->

<div id="calendar" class="section">

<div class="card">

<input type="date" id="slotDate">
<input type="time" id="slotTime">

<button onclick="addSlot()">Add Slot</button>

</div>

<div class="grid" id="calendarGrid"></div>

</div>

<!-- BOOKINGS -->

<div id="bookings" class="section">
<div id="bookingList"></div>
</div>

<!-- SERVICES -->

<div id="services" class="section">

<div class="card">

<input id="newName" placeholder="Service name">
<input id="newPrice" type="number" placeholder="Price">

<button onclick="addService()">Add</button>

</div>

<div id="serviceList"></div>

</div>

</div>

<!-- BUG FIX: Use external admin.js (was inline script mixed with backend code) -->
<script src="/js/admin.js"></script>

</body>
</html>
